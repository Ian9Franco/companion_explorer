name: Companion Explorer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test (.NET + frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run .NET tests
        run: dotnet test tests/CompanionExplorer.Core.Tests/CompanionExplorer.Core.Tests.csproj -c Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and production export
        working-directory: frontend
        run: npm run lint && npm run build