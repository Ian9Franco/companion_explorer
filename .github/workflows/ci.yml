name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test
        run: dotnet test tests/CompanionExplorer.Core.Tests/CompanionExplorer.Core.Tests.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Typecheck and export
        working-directory: frontend
        run: npm run lint && npm run build
