name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release bundle
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDir "dist/${{ github.ref_name }}-win-x64"

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ github.ref_name }}-win-x64" -DestinationPath "${{ github.ref_name }}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true