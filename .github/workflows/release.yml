name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release bundle
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDir "dist/${{ github.ref_name }}-win-x64" -Version "${{ github.ref_name }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v","V")
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\${{ github.ref_name }}-win-x64" "$PWD\installer\CompanionExplorer.iss"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CompanionExplorer-Setup.exe
          generate_release_notes: true