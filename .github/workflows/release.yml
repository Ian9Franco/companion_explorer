name: Release Companion Explorer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        description: "Version tag to build and publish (for example v0.1.3)"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows installer & publish release
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          $tag = if ($env:RELEASE_EVENT -eq 'workflow_dispatch') {
            $env:RELEASE_INPUT_TAG
          } elseif ($env:RELEASE_REF_TYPE -eq 'tag') {
            $env:RELEASE_REF_NAME
          } else {
            ''
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw 'An explicit version tag (vX.Y.Z) is required to publish a release'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || format('refs/tags/{0}', steps.release.outputs.tag) }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release bundle
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDir "dist/${{ steps.release.outputs.tag }}-win-x64" -Version "${{ steps.release.outputs.tag }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ steps.release.outputs.tag }}".TrimStart("v","V")
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc (install Inno Setup)" }
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\${{ steps.release.outputs.tag }}-win-x64" "$PWD\installer\CompanionExplorer.iss"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/CompanionExplorer-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true